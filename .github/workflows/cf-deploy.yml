name: Deploy to bucket

on:
  push:
    branches:
      [
        'develop',
        'master',
        'sandbox',
        'release',
        'gp4btc-staging',
        'gp4btc-prod',
      ]
jobs:
  cancel-previous:
    name: 'Cancel Previous Runs'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: styfle/cancel-workflow-action@3d86a7cc43670094ac248017207be0295edbc31d # 0.8.0
        with:
          access_token: ${{ github.token }}
  env_name:
    runs-on: ubuntu-latest
    steps:
      - name: Get GHA environment name
        id: env_name # TODO - Add sandbox ICS configuration, to use sandbox instead of dev
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo "Running on branch $GITHUB_REF"
          if [ "$GITHUB_REF" = "sandbox" ]; then
            echo "::set-output name=env_name::sandbox"
            echo "::set-output name=build_script::'npm run build'"
          elif [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            echo "::set-output name=env_name::dev"
            echo "::set-output name=build_script::npm run build"
          elif [ "$GITHUB_REF" = "refs/heads/master" ]; then
            echo "::set-output name=env_name::staging"
            echo "::set-output name=build_script::npm run build-staging"  
          elif [ "$GITHUB_REF" = "refs/heads/gp4btc-staging" ]; then
            echo "::set-output name=env_name::gp4btc-staging"
            echo "::set-output name=build_script::npm run build-gp4btc-staging"            
          elif [ "$GITHUB_REF" = "refs/heads/gp4btc-prod" ]; then
            echo "::set-output name=env_name::gp4btc-prod"
            echo "::set-output name=build_script::npm run build-gp4btc-prod"            
          elif [ "$GITHUB_REF" = "refs/heads/release" ]; then
            echo "::set-output name=env_name::prod"
            echo "::set-output name=build_script::npm run build-prod"
          fi
      - name: Use specified environment secrets from previous step
        run: |
          echo "Environment secrets set name ${{ steps.env_name.outputs.env_name }}"
          echo "Environment build script ${{ steps.env_name.outputs.build_script }}"
    outputs:
      env_name: ${{ steps.env_name.outputs.env_name }}
      env_file: ${{ steps.env_name.outputs.env_file }}
      build_script: ${{ steps.env_name.outputs.build_script }}
  deploy:
    environment:
      name: ${{ needs.env_name.outputs.env_name }}
    needs: [cancel-previous, env_name]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
      actions: write
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@27082cecf3ff7a1742dbd5e12605f0cb59dce2d9 # v2-beta
        with:
          node-version: '22.23.3'
          registry-url: https://registry.npmjs.org/
      - name: Cache node modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-node-
            ${{ runner.os }}-
      - name: Install npm packages
        run: |
          npm install
          envsubst < src/environments/constants.template.ts > src/environments/constants.ts
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838 # v1.7.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Build branch
        run: |
          ${{ needs.env_name.outputs.build_script }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
          INFURA_PROJECT_SECRET: ${{ secrets.INFURA_PROJECT_SECRET }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      - name: Ensure dist is present
        run: |
          test -d "dist" && echo OK || exit 1
      - name: Clear bucket
        run: |
          aws s3 rm s3://${{ secrets.BUCKET_NAME }} --recursive
      - name: Upload to bucket
        run: |
          aws s3 cp dist s3://${{ secrets.BUCKET_NAME }} --recursive
      - name: Invalidate CloudFront # cloudfront caches s3 content so after each deployment, it needs to be cleared.
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --paths "/*"
      - name: ping - dispatching initiating repository event
        if: github.ref == 'refs/heads/develop'
        run: |
          curl -X POST https://api.github.com/repos/energywebfoundation/switchboard-e2e/dispatches \
          -H 'Accept: application/vnd.github.everest-preview+json' \
          -u ${{ secrets.ACCESS_TOKEN }} \
          --data '{"event_type": "ping", "client_payload": { "repository": "'"$GITHUB_REPOSITORY"'" }}'
