<mat-tab-group mat-align-tabs="start" #enrolmentTabGroup (selectedTabChange)="showMe($event)">
  <mat-tab label="Enrolment Requests">
    <div class="row mx-0 mt-1">
      <div class="col-xl-12">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center">
          <h4 class="default-color strong my-4">Issue Role</h4>
          <button
            *ngIf="(isExperimental$ | async) && issuesRoles"
            mat-raised-button
            class="btn btn-primary btn-small mb-3 mb-lg-0"
            (click)="createVC()">
            Create VC
          </button>
        </div>
        <div class="card card-default mb-3 pb-0">
          <app-requested-enrolment-list
            [list]="requestedEnrolmentsList$ | async"
            [enrolmentStatus]="enrolmentStatus"
            (refreshList)="refreshIssuerList($event)">
          </app-requested-enrolment-list>
          <app-enrolment-pagination
            *ngIf="requestedEnrolmentPagination$ | async as pagination"
            [skip]="pagination.skip"
            [take]="pagination.take"
            [hasNextPage]="pagination.hasNextPage"
            (pageChange)="goToRequestedPage($event)"
            (lastPage)="goToRequestedLastPage()">
          </app-enrolment-pagination>
        </div>
      </div>
    </div>
  </mat-tab>
  <mat-tab label="My Enrolments">
    <div class="row mx-0 mt-1">
      <div class="col-xl-12">
        <div class="d-flex flex-column flex-md-row justify-content-md-start align-items-center">
          <h4 class="default-color strong my-4">My Enrolments</h4>
        </div>
        <div class="card card-default mb-3 pb-0">
          <app-my-enrolment-list
            [list]="myEnrolmentList$ | async"
            (refreshList)="refreshMyEnrolmentsList($event)"
            (removeEnrolment)="removeEnrolment($event)">
          </app-my-enrolment-list>
          <app-enrolment-pagination
            *ngIf="myEnrolmentPagination$ | async as pagination"
            [skip]="pagination.skip"
            [take]="pagination.take"
            [hasNextPage]="pagination.hasNextPage"
            (pageChange)="goToOwnedPage($event)"
            (lastPage)="goToOwnedLastPage()">
          </app-enrolment-pagination>
        </div>
      </div>
    </div>
  </mat-tab>
  <mat-tab label="Revocable Enrolments">
    <div class="row mx-0 mt-1">
      <div class="col-xl-12">
        <div class="d-flex flex-column flex-md-row justify-content-md-start align-items-center">
          <h4 class="default-color strong my-4">Revoke</h4>
        </div>
        <div class="card card-default mb-3 pb-0">
          <app-revoke-enrolment-list [list]="revocableList$ | async" (refreshList)="refreshRevocableList($event)">
          </app-revoke-enrolment-list>
          <app-enrolment-pagination
            *ngIf="revocablePagination$ | async as pagination"
            [skip]="pagination.skip"
            [take]="pagination.take"
            [hasNextPage]="pagination.hasNextPage"
            (pageChange)="goToRevokablePage($event)"
            (lastPage)="goToRevokableLastPage()">
          </app-enrolment-pagination>
        </div>
      </div>
    </div>
  </mat-tab>
</mat-tab-group>
